AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 + Docker para rodar o Prompt Optimizer.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nome do Key Pair para acesso via SSH.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium
    Description: Tipo da instancia EC2.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC onde a instancia sera criada.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica para a instancia EC2.
  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Segunda subnet publica (outra AZ) para o ALB. O ALB exige 2 subnets em zonas diferentes.
  RepoUrl:
    Type: String
    Description: URL git do repositorio.
  RepoBranch:
    Type: String
    Default: main
    Description: Branch a ser usada no deploy.
  AppPort:
    Type: Number
    Default: 80
    Description: Porta exposta pela aplicacao.
  DataVolumeSize:
    Type: Number
    Default: 8
    Description: Tamanho do volume EBS para armazenar dados (GiB).
  SSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR permitido para SSH (porta 22).
  AppCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR permitido para acessar a aplicacao.

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso HTTP ao ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AppCidr

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso SSH e aplicacao (traffico via ALB)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHCidr
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  PromptOptimizerSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: prompt-optimizer/app-secrets
      Description: "Segredos da aplicação (Gemini API, Admin, JWT)"
      SecretString: !Sub |
        {
          "GEMINI_API_KEY": "REPLACE_WITH_YOUR_GEMINI_API_KEY",
          "ADMIN_EMAIL": "REPLACE_WITH_YOUR_ADMIN_EMAIL",
          "ADMIN_PASSWORD": "REPLACE_WITH_YOUR_ADMIN_PASSWORD",
          "JWT_SECRET": "REPLACE_WITH_YOUR_JWT_SECRET"
        }
      Tags:
        - Key: Application
          Value: prompt-optimizer

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  SecretsReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SecretsManagerRead
      Roles:
        - !Ref AppRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref PromptOptimizerSecrets

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref AppInstanceProfile
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -eux
            apt-get update
            apt-get install -y docker.io docker-compose git awscli jq
            usermod -aG docker ubuntu
            systemctl enable --now docker
            DATA_DEVICE=/dev/xvdf
            if [ -b /dev/nvme1n1 ]; then
              DATA_DEVICE=/dev/nvme1n1
            fi
            for i in $(seq 1 10); do
              if [ -b "$DATA_DEVICE" ]; then
                break
              fi
              sleep 3
            done
            if ! file -s "$DATA_DEVICE" | grep -q ext4; then
              mkfs -t ext4 "$DATA_DEVICE"
            fi
            mkdir -p /data
            mount "$DATA_DEVICE" /data
            echo "$DATA_DEVICE /data ext4 defaults,nofail 0 2" >> /etc/fstab
            cd /home/ubuntu
            rm -rf app
            git clone --branch ${RepoBranch} ${RepoUrl} app
            cd app
            ln -sfn /data ./data
            if [ ! -f .env ]; then
              cp .env.template .env
            fi
            REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
            aws secretsmanager get-secret-value --secret-id prompt-optimizer/app-secrets --region "$REGION" --query SecretString --output text 2>/dev/null | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' > .env.tmp && mv .env.tmp .env || true
            rm -f .env.tmp
            docker-compose up -d --build app

  AppDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt AppInstance.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3

  AppDataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref AppInstance
      VolumeId: !Ref AppDataVolume
      Device: /dev/sdf

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: prompt-optimizer-project-tg
      Port: !Ref AppPort
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: prompt-optimizer-project
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref SubnetId
        - !Ref SubnetId2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  AppTargetGroupAttachment:
    Type: AWS::ElasticLoadBalancingV2::TargetGroupAttachment
    Properties:
      TargetGroupArn: !Ref AppTargetGroup
      TargetId: !Ref AppInstance
      Port: !Ref AppPort

Outputs:
  SecretArn:
    Description: ARN do secret (atualize os valores manualmente no console AWS)
    Value: !Ref PromptOptimizerSecrets
  InstanceId:
    Description: ID da instancia EC2
    Value: !Ref AppInstance
  AppLoadBalancerDNS:
    Description: DNS do ALB (acesso publico pela internet)
    Value: !GetAtt AppLoadBalancer.DNSName
  AppURL:
    Description: URL da aplicacao (via ALB)
    Value: !Sub "http://${AppLoadBalancer.DNSName}"
